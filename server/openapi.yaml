openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                priority: { $ref: "#/components/schemas/Priority" }
                effort: { $ref: "#/components/schemas/Effort" }
                parentId: { $ref: "#/components/schemas/ParentId" }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态、到期日、优先级或工作量
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                priority: { $ref: "#/components/schemas/Priority" }
                effort: { $ref: "#/components/schemas/Effort" }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务
      description: 删除主任务时，其子任务转为独立任务。
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    DueDate:
      type: string
      format: date
      description: 本地日历日期，格式为 YYYY-MM-DD。
    Priority:
      type: integer
      enum: [1, 2, 3]
      description: 1 为高，2 为中，3 为低。
    Effort:
      type: string
      enum: [small, medium, large]
      description: 分别表示小、中、大工作量。
    ParentId:
      type: string
      minLength: 1
      description: 已存在的主任务 ID，支持一层子任务。
    Task:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        dueDate: { $ref: "#/components/schemas/DueDate" }
        priority: { $ref: "#/components/schemas/Priority" }
        effort: { $ref: "#/components/schemas/Effort" }
        parentId: { $ref: "#/components/schemas/ParentId" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
